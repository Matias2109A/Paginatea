<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algo salió mal — TEA-MO</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #FAF7F2;
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            color: #4A433A;
            text-align: center;
            padding: 1.5rem;
            box-sizing: border-box;
        }
        .caja {
            max-width: 420px;
        }
        .icono {
            font-size: 48px;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 22px;
            margin: 0 0 0.5rem 0;
            color: #4A433A;
        }
        p {
            font-size: 15px;
            line-height: 1.6;
            color: #A38C74;
            margin: 0 0 1.5rem 0;
        }
        a.boton {
            display: inline-block;
            background-color: #A38C74;
            color: #FAF7F2;
            text-decoration: none;
            padding: 0.7rem 1.4rem;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        a.boton:hover {
            background-color: #4A433A;
        }
    </style>
</head>
<body>
    <div class="caja">
        <div class="icono">⚠️</div>
        <h1>Algo salió mal de nuestro lado</h1>
        <p>Ya quedó registrado el error. Probá de nuevo en unos minutos, o volvé al inicio mientras tanto.</p>
        <a class="boton" href="http://localhost:8000/panel-tea-mo/">Volver al inicio</a>
    </div>
</body>
</html>
