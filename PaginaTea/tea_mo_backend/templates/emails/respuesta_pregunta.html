<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"></head>
<body style="margin:0; padding:0; background-color:#FAF7F2; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FAF7F2; padding:2rem 1rem;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" style="max-width:480px; background-color:#ffffff; border-radius:14px; overflow:hidden; border:1px solid #D8CFC4;">
                    <tr>
                        <td style="background-color:#A38C74; padding:1.5rem 2rem;">
                            <span style="color:#FAF7F2; font-size:20px; font-weight:700;">TEA-MO</span>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:2rem;">
                            <h1 style="margin:0 0 1rem 0; color:#4A433A; font-size:18px;">¡Te respondimos! 💬</h1>
                            <p style="color:#4A433A; font-size:14px; line-height:1.6; margin:0 0 1.25rem 0;">
                                Hola {{ nombre }}, respondimos la pregunta que nos dejaste:
                            </p>
                            <table role="presentation" width="100%" style="background-color:#EFE9DF; border-radius:10px; margin-bottom:1.25rem;">
                                <tr>
                                    <td style="padding:1rem 1.25rem; color:#8C7660; font-size:13px; font-style:italic;">
                                        « {{ pregunta }} »
                                    </td>
                                </tr>
                            </table>
                            <p style="color:#A38C74; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; margin:0 0 0.5rem 0; font-weight:700;">
                                Nuestra respuesta
                            </p>
                            <p style="color:#4A433A; font-size:14px; line-height:1.6; margin:0 0 1.5rem 0;">
                                {{ respuesta }}
                            </p>
                            <p style="color:#A38C74; font-size:12px; line-height:1.6; margin:0;">
                                Gracias por escribirnos. — Equipo TEA-MO
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
